<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 2;
        }

        .form-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #5f6368;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #dadce0;
            border-radius: 5px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.2rem;
            color: #5f6368;
        }

        .toggle-btn {
            color: #3498db;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            padding: 0;
        }

        .toggle-btn:hover {
            text-decoration: underline;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }

        /* 验证代码样式 */
        .code-display {
            background-color: #f8f9fa;
            padding: 0.8rem;
            border-radius: 5px;
            font-family: Consolas, monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
            border: 1px solid #eee;
        }

        /* 密钥相关样式 */
        .key-link {
            color: #3498db;
            text-decoration: none;
            display: inline-block;
            margin: 0.3rem 0 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .key-link:hover {
            text-decoration: underline;
        }

        .hint {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.3rem;
        }

        /* 人机验证弹窗样式 */
        #captcha-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: #3498db;
            transition: width 2s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录面板 -->
        <div id="login-panel" class="form-panel active">
            <h2 class="form-title">登录</h2>
            <div class="input-group">
                <label for="login-username">用户名</label>
                <input type="text" id="login-username" required>
                <div class="error-message" id="login-user-error">用户名不能为空</div>
            </div>
            <div class="input-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" required>
                <div class="error-message" id="login-pwd-error">密码长度至少4位（支持大小写字母、数字、下划线）</div>
            </div>
            <div class="error-message" id="login-fail-error" style="margin-top: 1rem;">用户名或密码错误</div>
            <button class="btn" id="login-btn">登录</button>
            <p class="toggle-link">
                还没有账号？<button class="toggle-btn" id="show-register">立即注册</button>
            </p>
        </div>

        <!-- 注册面板（含验证模块） -->
        <div id="register-panel" class="form-panel">
            <h2 class="form-title">注册</h2>
            <div class="input-group">
                <label for="register-username">用户名</label>
                <input type="text" id="register-username" required placeholder="支持大小写字母、数字、下划线，至少1位">
                <div class="error-message" id="register-user-error">用户名格式错误（仅支持大小写字母、数字、下划线）</div>
                <div class="error-message" id="register-user-exist-error">该用户名已被注册</div>
            </div>

            <!-- 验证代码（密码上方） -->
            <div class="input-group">
                <label>验证代码（请勿修改）</label>
                <div class="code-display" id="verify-code">-- 输入用户名后点击框外生成 --</div>
                <div class="hint">由系统随机生成，一个用户名仅能获取一次</div>
            </div>

            <!-- 验证密钥（验证代码下方、密码上方） -->
            <div class="input-group">
                <label for="verify-key">验证密钥</label>
                <input type="text" id="verify-key" required placeholder="点击下方获取密钥">
                <span class="key-link" id="get-key-link">👉 立即获取密钥</span>
                <div class="hint">密钥必须当天使用（每日更新）</div>
                <div class="error-message" id="key-error">密钥无效或已过期</div>
            </div>

            <!-- 密码和确认密码 -->
            <div class="input-group">
                <label for="register-password">密码</label>
                <input type="password" id="register-password" required placeholder="支持大小写字母、数字、下划线，至少4位">
                <div class="error-message" id="register-pwd-error">密码格式错误（仅支持大小写字母、数字、下划线，至少4位）</div>
            </div>
            <div class="input-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" required>
                <div class="error-message" id="confirm-error">两次密码不一致</div>
            </div>

            <button class="btn" id="register-btn">注册</button>
            <p class="toggle-link">
                已有账号？<button class="toggle-btn" id="show-login">立即登录</button>
            </p>
        </div>
    </div>

    <!-- 人机验证弹窗 -->
    <div id="captcha-modal">
        <div class="modal-content">
            <h3 style="color: #2c3e50; margin-bottom: 20px;">验证您是真人</h3>
            <p>正在自动验证身份...</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">
                验证完成后自动填充密钥
            </p>
        </div>
    </div>

    <script>
        // 从本地存储获取用户数据
        let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
        let currentVerifyCode = ''; // 存储当前验证代码

        // DOM元素获取
        const verifyCodeEl = document.getElementById('verify-code');
        const verifyKeyInput = document.getElementById('verify-key');
        const getKeyLink = document.getElementById('get-key-link');
        const captchaModal = document.getElementById('captcha-modal');
        const progressBar = document.getElementById('progress-bar');
        const regUsername = document.getElementById('register-username');
        const regPassword = document.getElementById('register-password');
        const confirmPassword = document.getElementById('confirm-password');
        const loginUsername = document.getElementById('login-username');
        const loginPassword = document.getElementById('login-password');

        // 面板切换逻辑
        const loginPanel = document.getElementById('login-panel');
        const registerPanel = document.getElementById('register-panel');
        document.getElementById('show-register').addEventListener('click', () => {
            loginPanel.classList.remove('active');
            registerPanel.classList.add('active');
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
        });
        document.getElementById('show-login').addEventListener('click', () => {
            registerPanel.classList.remove('active');
            loginPanel.classList.add('active');
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
        });

        // 1. 用户名失去焦点生成验证代码（允许数字）
        regUsername.addEventListener('blur', () => {
            const username = regUsername.value.trim();
            if (!username) {
                verifyCodeEl.textContent = '-- 输入用户名后点击框外生成 --';
                currentVerifyCode = '';
                return;
            }

            // 用户名规则：支持大小写字母、数字、下划线
            const usernameRegex = /^[A-Za-z0-9_]+$/;
            if (!usernameRegex.test(username)) {
                document.getElementById('register-user-error').style.display = 'block';
                verifyCodeEl.textContent = '-- 用户名格式错误 --';
                currentVerifyCode = '';
                return;
            }

            // 检查用户名是否已存在
            if (users.some(user => user.username === username)) {
                document.getElementById('register-user-exist-error').style.display = 'block';
                verifyCodeEl.textContent = '-- 用户名已存在 --';
                currentVerifyCode = '';
                return;
            }

            // 生成8位验证代码
            currentVerifyCode = generateVerifyCode();
            verifyCodeEl.textContent = currentVerifyCode;
            document.getElementById('register-user-error').style.display = 'none';
            document.getElementById('register-user-exist-error').style.display = 'none';
        });

        // 2. 生成8位随机验证代码
        function generateVerifyCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let code = '';
            for (let i = 0; i < 8; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }

        // 3. 生成密钥（按规则计算）
        function generateKey(code) {
            // 拼接ASCII码
            let asciiStr = '';
            for (let char of code) {
                asciiStr += char.charCodeAt(0).toString();
            }
            // 拼接当天日期（年+月+日）
            const today = new Date();
            const year = today.getFullYear().toString();
            const month = (today.getMonth() + 1).toString().padStart(2, '0');
            const day = today.getDate().toString().padStart(2, '0');
            const dateStr = year + month + day;
            // 转16进制取前16位
            const combined = BigInt(asciiStr) * BigInt(10 ** dateStr.length) + BigInt(dateStr);
            let hex = combined.toString(16).toUpperCase();
            hex = hex.padStart(16, '0').substring(0, 16);
            return hex;
        }

        // 4. 点击获取密钥触发人机验证（100%触发）
        getKeyLink.addEventListener('click', () => {
            const username = regUsername.value.trim();
            if (!username) {
                alert('请先输入用户名！');
                regUsername.focus();
                return;
            }
            if (!currentVerifyCode) {
                alert('请先输入用户名并点击输入框外生成验证代码！');
                return;
            }

            // 显示弹窗并启动进度条
            captchaModal.style.display = 'flex';
            progressBar.style.width = '0';

            // 模拟验证过程（2秒后完成）
            setTimeout(() => {
                progressBar.style.width = '100%';
                setTimeout(() => {
                    const key = generateKey(currentVerifyCode);
                    verifyKeyInput.value = key; // 自动填充密钥
                    captchaModal.style.display = 'none'; // 关闭弹窗
                }, 800);
            }, 300);
        });

        // 5. 注册逻辑（用户名和密码均允许数字）
        document.getElementById('register-btn').addEventListener('click', () => {
            // 隐藏所有错误提示
            document.querySelectorAll('#register-panel .error-message').forEach(el => el.style.display = 'none');
            let isValid = true;
            const username = regUsername.value.trim();
            const password = regPassword.value;
            const confirmPwd = confirmPassword.value;
            const inputKey = verifyKeyInput.value.trim();

            // 验证用户名（允许数字）
            if (!/^[A-Za-z0-9_]+$/.test(username) || !username) {
                document.getElementById('register-user-error').style.display = 'block';
                isValid = false;
            } else if (users.some(user => user.username === username)) {
                document.getElementById('register-user-exist-error').style.display = 'block';
                isValid = false;
            }

            // 验证密钥
            const correctKey = generateKey(currentVerifyCode);
            if (!inputKey || inputKey !== correctKey) {
                document.getElementById('key-error').style.display = 'block';
                isValid = false;
            }

            // 验证密码（允许数字）
            if (!/^[A-Za-z0-9_]+$/.test(password) || password.length < 4) {
                document.getElementById('register-pwd-error').style.display = 'block';
                isValid = false;
            }

            // 验证确认密码
            if (password !== confirmPwd) {
                document.getElementById('confirm-error').style.display = 'block';
                isValid = false;
            }

            // 注册成功处理
            if (isValid) {
                users.push({
                    username,
                    password,
                    key: inputKey
                });
                localStorage.setItem('registeredUsers', JSON.stringify(users));
                alert('注册成功！请登录');
                
                // 切换到登录面板并清空注册表单
                registerPanel.classList.remove('active');
                loginPanel.classList.add('active');
                regUsername.value = '';
                verifyCodeEl.textContent = '-- 输入用户名后点击框外生成 --';
                verifyKeyInput.value = '';
                regPassword.value = '';
                confirmPassword.value = '';
                currentVerifyCode = '';
            }
        });

        // 6. 登录逻辑
        document.getElementById('login-btn').addEventListener('click', () => {
            // 隐藏所有错误提示
            document.querySelectorAll('#login-panel .error-message').forEach(el => el.style.display = 'none');
            let isValid = true;
            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            // 验证用户名
            if (!username) {
                document.getElementById('login-user-error').style.display = 'block';
                isValid = false;
            }

            // 验证密码
            if (password.length < 4) {
                document.getElementById('login-pwd-error').style.display = 'block';
                isValid = false;
            }

            // 验证账号密码是否匹配
            if (isValid) {
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    // 登录成功，存储当前用户并跳转主页
                    localStorage.setItem('currentUser', username);
                    window.location.href = 'home.html';
                } else {
                    document.getElementById('login-fail-error').style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
