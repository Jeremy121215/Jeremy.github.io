<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百宝箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            background-color: #f9f9f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(8px, 3vw, 20px);
            font-size: 16px;
        }
        
        .treasure-container {
            width: 100%;
            max-width: min(800px, 95vw);
            background: white;
            border-radius: clamp(8px, 2vw, 12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        h3 {
            color: #2c3e50;
            margin: clamp(12px, 3vw, 20px) 0;
            text-align: center;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            padding: 0 clamp(10px, 3vw, 15px);
        }
        
        .treasure-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .treasure-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .treasure-tab {
            padding: clamp(10px, 2.5vw, 14px) clamp(15px, 3vw, 20px);
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            font-size: clamp(0.9rem, 3vw, 1rem);
            border-bottom: 3px solid transparent;
            text-align: center;
            min-width: max-content;
            flex: 1;
        }
        
        .treasure-tab.active {
            background: #f39c12;
            color: white;
            border-bottom-color: #e67e22;
        }
        
        .treasure-content {
            display: none;
            flex: 1;
            padding: clamp(12px, 3vw, 20px);
            min-height: min(300px, 40vh);
        }
        
        .treasure-content.active {
            display: block;
        }
        
        /* 每日人品样式 */
        .personality-result {
            text-align: center;
            padding: clamp(15px, 4vw, 25px) clamp(12px, 3vw, 20px);
            background: white;
            border-radius: clamp(8px, 2vw, 12px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .personality-result h4 {
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            margin-bottom: clamp(12px, 3vw, 20px);
            color: #2c3e50;
            font-weight: 600;
        }
        
        .personality-result p {
            margin: clamp(8px, 2vw, 12px) 0;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.5;
        }
        
        .personality-result .score {
            color: #e74c3c;
            font-weight: bold;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
        }
        
        .personality-result .level {
            color: #3498db;
            font-weight: bold;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
        }
        
        .personality-result .desc {
            color: #27ae60;
            margin-top: clamp(10px, 2.5vw, 15px);
            line-height: 1.6;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            padding: clamp(10px, 3vw, 15px);
            background: #f8f9fa;
            border-radius: clamp(6px, 1.5vw, 8px);
            border-left: 4px solid #2ecc71;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .personality-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 14px) clamp(20px, 4vw, 30px);
            border-radius: clamp(6px, 1.5vw, 8px);
            cursor: pointer;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            margin-top: clamp(15px, 3vw, 20px);
            transition: all 0.3s;
            width: 100%;
            max-width: min(300px, 90vw);
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(52, 152, 219, 0.2);
        }
        
        .personality-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .personality-btn:active:not(:disabled) {
            background: #2980b9;
            transform: scale(0.98);
        }
        
        /* 自定义下载样式 */
        .download-form {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 3vw, 18px);
            padding: clamp(12px, 3vw, 20px);
            background: white;
            border-radius: clamp(8px, 2vw, 12px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .download-form input {
            padding: clamp(14px, 3.5vw, 16px);
            border: 2px solid #ddd;
            border-radius: clamp(6px, 1.5vw, 8px);
            font-size: clamp(0.95rem, 2.5vw, 1rem);
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        
        .download-form input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243, 156, 18, 0.1);
        }
        
        .download-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: clamp(14px, 3.5vw, 16px);
            border-radius: clamp(6px, 1.5vw, 8px);
            cursor: pointer;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            transition: all 0.3s;
            width: 100%;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(46, 204, 113, 0.2);
        }
        
        .download-btn:active {
            background: #27ae60;
            transform: scale(0.98);
        }
        
        /* 横屏适配 */
        @media (orientation: landscape) and (max-height: 600px) {
            body {
                padding: 8px;
            }
            
            .treasure-container {
                max-width: 95vw;
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .treasure-tab {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .treasure-content {
                padding: 12px;
                min-height: auto;
            }
            
            .personality-result {
                padding: 12px;
            }
            
            .personality-result h4 {
                font-size: 1.2rem;
                margin-bottom: 10px;
            }
            
            .personality-result p {
                margin: 6px 0;
                font-size: 0.9rem;
            }
            
            .personality-result .desc {
                font-size: 0.85rem;
                padding: 10px;
                margin-top: 8px;
            }
            
            .download-form {
                padding: 12px;
                gap: 10px;
            }
        }
        
        /* 超小屏幕适配 */
        @media (max-width: 320px) {
            .treasure-tab {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
            
            h3 {
                font-size: 1.1rem;
            }
            
            .personality-btn {
                font-size: 0.95rem;
                padding: 10px 16px;
            }
        }
        
        /* 超大屏幕适配 */
        @media (min-width: 1200px) {
            .treasure-container {
                max-width: 800px;
            }
        }
    </style>
</head>
<body>
    <div class="treasure-container">
        <h3>百宝箱功能中心</h3>
        <div class="treasure-tabs">
            <div class="treasure-tab active" data-tab="personality">每日人品</div>
            <div class="treasure-tab" data-tab="download">自定义下载</div>
        </div>

        <!-- 每日人品功能区 -->
        <div class="treasure-content active" id="personalityTab">
            <div class="personality-result" id="personalityResult">
                <h4>点击生成今日人品</h4>
                <p>人品：<span class="score">-</span></p>
                <p>等级：<span class="level">-</span></p>
                <p class="desc">描述：-</p>
                <button class="personality-btn" id="generatePersonality">生成今日人品</button>
            </div>
        </div>

        <!-- 自定义下载功能区 -->
        <div class="treasure-content" id="downloadTab">
            <form class="download-form" id="downloadForm">
                <input type="text" id="downloadUrl" placeholder="输入下载链接（以http/https开头，如：https://example.com/file.zip）" required>
                <input type="text" id="fileName" placeholder="输入文件名称（自动补全常见后缀）" required>
                <button class="download-btn" type="submit">开始下载</button>
            </form>
        </div>
    </div>

    <script>
        // 确保DOM完全加载后再执行脚本
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 标签页切换逻辑
            const treasureTabs = document.querySelectorAll('.treasure-tab');
            const treasureContents = document.querySelectorAll('.treasure-content');

            treasureTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    treasureTabs.forEach(t => t.classList.remove('active'));
                    treasureContents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
                });
            });

            // 2. 每日人品功能 - 1-100分专属描述
            const generatePersonality = document.getElementById('generatePersonality');
            const personalityResult = document.getElementById('personalityResult');

                // 11-20分（E+级）

                // 21-30分（D级）
                "运气普通偏下！做事有点卡，多些耐心~",
                "小波折不断！但都能解决，问题不大~",
                "运气稍差！预期没达到，下次再努力~",

                "平淡无奇！没好运也没坏运，平稳度过~",
                // 31-40分（D+级）

                "小顺利夹杂小麻烦！整体还行，别较真~",
                "运气平平！办事效率一般，慢慢推进~",
                "平淡带点小顺！喝到喜欢的饮料，知足常乐~",
                "运气普通！没遇到坏事，也算一种幸运~",
                "小波折后有小顺！先苦后甜，别放弃~",
                "运气中等！想买的东西降价，小开心~",
                "平淡但安稳！没惊喜没意外，踏实过一天~",
                // 41-50分（C级）
                "运气平稳！日常小事都顺利，无惊无险~",
                "普普通通！没好运没坏运，平常心对待~",
                "小顺小逆！整体还行，重点事能办成~",
                "运气中等！偶尔有小惊喜，比如捡到零钱~",

                "平淡却安心！没遇到麻烦，也算圆满~",
                "小惊喜不断！比如奶茶买一送一，开心~",
                "运气平稳！办事顺利，心情也不错~",
                "普普通通的好运！日常小事都顺心~",
                // 51-60分（C+级）
                "运气不错！想买的东西刚好打折，划算~",
                "小幸运降临！出门遇熟人，聊天很开心~",
                "运气中等偏上！办事效率高，没阻碍~",
                "惊喜连连！比如抽中小奖品，心情愉悦~",
                "运气在线！想做的事顺利推进，加油~",
                "小确幸不断！喝到好喝的咖啡，满足~",
                "运气不错！遇到乐于助人的人，顺利解决问题~",
                "日常小好运！比如公交车刚好赶上，省心~",
                "运气达标！重点事能成，小细节也顺心~",
                "平稳且顺利！一天下来没烦恼，开心~",
                // 61-70分（B级）
                "好运加持！办事一路绿灯，效率超高~",
                "运气在线！想办的事都能成，心情大好~",
                "小幸运不断！比如下雨带伞，没被淋湿~",
                "运气不错！遇到好天气，适合出门逛逛~",
                "顺风顺水！做事没阻碍，还能摸鱼一会儿~",

                "运气爆棚！抽中优惠券，省钱小能手~",

                "小幸运降临！朋友请客，意外之喜~",
                "运气在线！所有事都按计划来，完美~",
                // 71-80分（B+级）
                "好运爆棚！想啥来啥，心想事成的一天~",
                "惊喜不断！比如中奖小礼品，开心一整天~",
                "运气超棒！办事不仅顺利，还能提前完成~",
                "小幸运扎堆！出门遇贵人，难题轻松解~",
                "好运连连！买东西刚好降价，太划算啦~",
                "运气绝佳！想做的事全成，还能摸鱼~",
                "惊喜不断！比如收到意外祝福，暖心~",
                "NB！这么暗广的数字你都能抽到~",
                "小幸运不断！比如堵车刚好避开，省心~",
                "运气在线！一整天都顺风顺水，愉悦~",
                // 81-90分（A级）
                "欧气附体！抽奖必中，好运挡都挡不住~",
                "惊喜不断！意外之财找上门，太幸运啦~",
                "运气爆棚！所有心愿都实现，幸福感满满~",
                "欧皇潜质！办事超顺利，还能收获小惊喜~",
                "好运连连！出门遇好事，心情美到飞起~",
                "运气绝佳！想做的事全成，效率翻倍~",
                "惊喜不断！比如被人夸奖，信心大增~",
                "欧气满满！买东西抽中大奖，太开心~",
                "好运加持！难题迎刃而解，轻松应对~",
                "运气超棒！一整天都有好消息，圆满~",
                // 91-100分（S级）
                "天选之子！你就是91！",
                "欧皇本皇！92分的你，好运爆棚，心想事成~",
                "封神时刻！93分的你，所有好事都找上门~",
                "幸运值拉满！94分的你，抽奖必中头奖~",
                "人生赢家！95分的你，事业爱情双丰收~",
                "好运天花板！96分的你，出门捡钱不是梦~",
                "欧气冲天！97分的你，所有阻碍都让路~",
                "幸运爆棚！98分的你，心想事成，万事顺意~",
                "神级好运！99分的你，人生开绿灯，无往不利~",
                "666这入是桂"

            // 分数对应等级判断函数
            function getLevel(score) {
                if (score >= 91) return 'S';
                if (score >= 81) return 'A';
                if (score >= 71) return 'B+';
                if (score >= 61) return 'B';
                if (score >= 51) return 'C+';
                if (score >= 41) return 'C';
                if (score >= 31) return 'D+';
                if (score >= 21) return 'D';
                if (score >= 11) return 'E+';
                return 'E';
            }

            // 生成今日人品逻辑
            generatePersonality.addEventListener('click', () => {
                if (hasGeneratedToday) {
                    alert('今日人品已生成，明天0点后可重新抽取~');
                    return;
                }
                const score = Math.floor(Math.random() * 100) + 1; // 1-100随机数
                const level = getLevel(score);
                const description = personalityDescriptions[score - 1];

                // 渲染结果
                personalityResult.innerHTML = `
                    <h4>今日人品评分</h4>
                    <p>人品：<span class="score">${score}分</span></p>
                    <p>等级：<span class="level">${level}级</span></p>
                    <p class="desc">描述：${description}</p>
                    <button class="personality-btn" disabled>今日已生成（明日重置）</button>
                `;

                // 本地存储标记
                hasGeneratedToday = true;
                localStorage.setItem('personalityGeneratedDate', today);
                localStorage.setItem('todayPersonalityScore', score);
            });

            // 页面加载时恢复今日人品结果
            const storedDate = localStorage.getItem('personalityGeneratedDate');
            const storedScore = localStorage.getItem('todayPersonalityScore');
            
            if (storedDate === today && storedScore) {
                hasGeneratedToday = true;
                const score = parseInt(storedScore);
                const level = getLevel(score);
                const description = personalityDescriptions[score - 1];
                
                personalityResult.innerHTML = `
                    <h4>今日人品评分</h4>
                    <p>人品：<span class="score">${score}分</span></p>
                    <p>等级：<span class="level">${level}级</span></p>
                    <p class="desc">描述：${description}</p>
                    <button class="personality-btn" disabled>今日已生成（明日重置）</button>
                `;
            }

            // 3. 自定义下载功能（优化版）
            const downloadForm = document.getElementById('downloadForm');
            downloadForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const url = document.getElementById('downloadUrl').value.trim();
                let fileName = document.getElementById('fileName').value.trim();

                // 链接格式校验
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    alert('请输入有效的下载链接（以http/https开头）');
                    return;
                }

                // 自动补全常见文件后缀
                const extReg = /\.[a-zA-Z0-9]{2,4}$/;
                if (!extReg.test(fileName)) {
                    const urlExt = url.split('.').pop().split('?')[0].split('#')[0];
                    const commonExts = ['zip', 'rar', 'exe', 'pdf', 'docx', 'xlsx', 'jpg', 'png', 'mp4', 'mp3', 'txt', 'md'];
                    if (commonExts.includes(urlExt)) {
                        fileName += `.${urlExt}`;
                    }
                }

                // 触发下载
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // 重置表单
                downloadForm.reset();
                alert(`下载已触发！文件将保存为：${fileName}`);
            });
        });
    </script>
</body>
</html>
