<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>答题系统 - 开始答题</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --info-color: #9b59b6;
            --light-bg: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-light: #666;
            --border-color: #ddd;
            --border-radius: 8px;
            --box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: var(--light-bg);
            color: var(--text-color);
            font-size: 16px;
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                font-size: 13px;
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            transition: var(--transition);
            border: 1px solid var(--primary-color);
        }

        .back-link:hover {
            text-decoration: none;
            background-color: rgba(52, 152, 219, 0.1);
        }

        .section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
        }

        .quiz-info {
            background-color: #f0f8ff;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 30px;
        }

        .quiz-info h2 {
            color: var(--secondary-color);
            border-bottom: none;
            margin-bottom: 15px;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            color: var(--text-light);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--warning-color);
            color: white;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: var(--box-shadow);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .timer {
                position: static;
                margin: 0 auto 20px;
                text-align: center;
                width: fit-content;
            }
        }

        .question-item {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: white;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary-color);
            flex: 1;
        }

        .question-score {
            background-color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
        }

        .options-container {
            margin-top: 15px;
        }

        .option-item {
            margin-bottom: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .option-item:hover {
            background-color: #f5f5f5;
            border-color: var(--primary-color);
        }

        .option-item.selected {
            background-color: rgba(52, 152, 219, 0.1);
            border-color: var(--primary-color);
        }

        .option-item.correct {
            background-color: rgba(46, 204, 113, 0.1);
            border-color: var(--success-color);
        }

        .option-item.incorrect {
            background-color: rgba(231, 76, 60, 0.1);
            border-color: var(--danger-color);
        }

        .option-text {
            margin-left: 10px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
        }

        .short-answer-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            margin-top: 10px;
            transition: var(--transition);
        }

        .short-answer-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .truefalse-options {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .truefalse-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .truefalse-item:hover {
            background-color: #f5f5f5;
        }

        .truefalse-item.selected {
            background-color: rgba(52, 152, 219, 0.1);
            border-color: var(--primary-color);
        }

        .truefalse-item input {
            margin-right: 10px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background-color: #27ae60;
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background-color: #e67e22;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .report-section {
            display: none;
        }

        .score-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: var(--border-radius);
        }

        .score-number {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .score-label {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        .pass-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--success-color);
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .fail-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--danger-color);
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .result-item {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--border-color);
        }

        .result-item.correct {
            border-left-color: var(--success-color);
            background-color: rgba(46, 204, 113, 0.05);
        }

        .result-item.incorrect {
            border-left-color: var(--danger-color);
            background-color: rgba(231, 76, 60, 0.05);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-status {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 4px;
        }

        .result-status.correct {
            color: var(--success-color);
            background-color: rgba(46, 204, 113, 0.1);
        }

        .result-status.incorrect {
            color: var(--danger-color);
            background-color: rgba(231, 76, 60, 0.1);
        }

        .user-answer,
        .correct-answer {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            font-family: monospace;
        }

        .user-answer {
            border-left: 3px solid var(--warning-color);
        }

        .correct-answer {
            border-left: 3px solid var(--success-color);
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            border-left: 3px solid var(--info-color);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-light);
        }

        .error-message {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger-color);
            padding: 20px;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--danger-color);
            margin: 20px 0;
        }

        .print-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        @media print {
            .no-print,
            .btn-group,
            .timer,
            .print-btn,
            .back-link {
                display: none !important;
            }
            
            .section {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            
            .score-display {
                break-inside: avoid;
            }
        }

        .version-info {
            text-align: center;
            margin: 50px 0 20px;
            color: var(--text-light);
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="timer" class="timer" style="display: none;">剩余时间: 60:00</div>
    
    <a href="index.html" class="back-link">← 返回答题系统</a>
    
    <div id="loading" class="loading">
        <h2>正在加载试卷...</h2>
        <p>请稍候</p>
    </div>
    
    <!-- 答题页面 -->
    <div id="quiz-container" style="display: none;">
        <header>
            <h1 id="quiz-title">加载中...</h1>
            <p id="quiz-description"></p>
        </header>
        
        <div class="section quiz-info">
            <h2>📋 试卷信息</h2>
            <div id="quiz-meta" class="quiz-meta">
                <!-- 试卷信息会动态填充 -->
            </div>
        </div>
        
        <div id="questions-list">
            <!-- 题目会动态加载到这里 -->
        </div>
        
        <div class="btn-group">
            <button type="button" id="submit-quiz" class="btn btn-primary">提交试卷</button>
            <button type="button" id="reset-quiz" class="btn btn-secondary">重置答案</button>
        </div>
    </div>
    
    <!-- 报告页面 -->
    <div id="report-container" class="report-section">
        <header>
            <h1>📊 答题报告</h1>
            <p>查看您的答题结果和详细分析</p>
        </header>
        
        <div class="score-display">
            <div class="score-label">您的得分</div>
            <div class="score-number" id="total-score">0</div>
            <div id="pass-status"></div>
            <div style="margin-top: 15px; font-size: 1.1rem;">
                正确: <span id="correct-count" style="color: var(--success-color); font-weight: bold;">0</span> 题 | 
                错误: <span id="incorrect-count" style="color: var(--danger-color); font-weight: bold;">0</span> 题
            </div>
        </div>
        
        <div class="section">
            <h2>📝 详细分析</h2>
            <div id="results-list">
                <!-- 每道题的结果会动态填充 -->
            </div>
        </div>
        
        <div class="btn-group">
            <button type="button" id="restart-quiz" class="btn btn-primary">重新答题</button>
            <button type="button" id="print-report" class="btn btn-success print-btn">打印报告</button>
            <a href="index.html" class="btn btn-secondary">返回答题系统</a>
        </div>
    </div>
    
    <div class="version-info">
        答题系统版本：v2.0.0 | 最后更新：2025-11-22 | 支持答题和报告功能
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const quizCode = urlParams.get('code');
            
            if (!quizCode) {
                showError('请提供试卷代码，格式：render-quiz.html?code=试卷ID');
                return;
            }
            
            // 定义试卷数据
            let quizData = null;
            let userAnswers = {};
            let timerInterval = null;
            let timeRemaining = 0;
            
            // 加载试卷数据
            loadQuizData(quizCode);
            
            // 加载试卷数据
            async function loadQuizData(code) {
                try {
                    // 尝试从GitHub raw加载
                    const response = await fetch(`https://raw.githubusercontent.com/Jeremy121215/Jeremy.github.io/main/${code}.json`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    quizData = await response.json();
                    displayQuiz();
                    
                } catch (error) {
                    console.error('加载试卷失败:', error);
                    showError(`加载试卷失败: ${error.message}<br>请确保试卷文件已保存到GitHub仓库的main目录下，文件名为: ${code}.json`);
                }
            }
            
            // 显示错误信息
            function showError(message) {
                document.getElementById('loading').innerHTML = `
                    <div class="error-message">
                        <h2>加载失败</h2>
                        <p>${message}</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 15px;">返回答题系统</a>
                    </div>
                `;
            }
            
            // 显示试卷
            function displayQuiz() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz-container').style.display = 'block';
                
                // 设置试卷信息
                document.getElementById('quiz-title').textContent = quizData.title;
                document.getElementById('quiz-description').textContent = quizData.description || '';
                
                // 设置试卷元信息
                const metaHtml = `
                    <div class="meta-item">👤 创建者: ${quizData.author}</div>
                    <div class="meta-item">📅 创建时间: ${new Date(quizData.createdAt).toLocaleDateString()}</div>
                    <div class="meta-item">❓ 题目数量: ${quizData.questions.length}</div>
                    <div class="meta-item">⏱️ 时间限制: ${quizData.answerConditions.timeLimit || 0}分钟</div>
                    <div class="meta-item">🎯 及格分数: ${quizData.answerConditions.passScore || 60}分</div>
                `;
                document.getElementById('quiz-meta').innerHTML = metaHtml;
                
                // 初始化计时器
                const timeLimit = quizData.answerConditions.timeLimit || 0;
                if (timeLimit > 0) {
                    timeRemaining = timeLimit * 60; // 转换为秒
                    startTimer();
                }
                
                // 渲染题目
                renderQuestions();
                
                // 绑定按钮事件
                document.getElementById('submit-quiz').addEventListener('click', submitQuiz);
                document.getElementById('reset-quiz').addEventListener('click', resetAnswers);
            }
            
            // 开始计时器
            function startTimer() {
                document.getElementById('timer').style.display = 'block';
                updateTimerDisplay();
                
                timerInterval = setInterval(function() {
                    timeRemaining--;
                    updateTimerDisplay();
                    
                    if (timeRemaining <= 0) {
                        clearInterval(timerInterval);
                        alert('时间到！系统将自动提交试卷。');
                        submitQuiz();
                    }
                }, 1000);
            }
            
            // 更新计时器显示
            function updateTimerDisplay() {
                const minutes = Math.floor(timeRemaining / 60);
                const seconds = timeRemaining % 60;
                document.getElementById('timer').textContent = `剩余时间: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // 时间警告
                if (timeRemaining <= 300) { // 最后5分钟
                    document.getElementById('timer').style.backgroundColor = var('--warning-color');
                }
                if (timeRemaining <= 60) { // 最后1分钟
                    document.getElementById('timer').style.backgroundColor = var('--danger-color');
                }
            }
            
            // 渲染题目
            function renderQuestions() {
                const questionsList = document.getElementById('questions-list');
                let questionsHtml = '';
                
                quizData.questions.forEach((question, index) => {
                    questionsHtml += `
                        <div class="section question-item" data-question-id="${question.id}">
                            <div class="question-header">
                                <div class="question-title">第${index + 1}题: ${question.text}</div>
                                <div class="question-score">${question.score}分</div>
                            </div>
                            ${renderQuestionOptions(question, index)}
                        </div>
                    `;
                });
                
                questionsList.innerHTML = questionsHtml;
                
                // 绑定选项选择事件
                bindOptionEvents();
            }
            
            // 渲染题目选项
            function renderQuestionOptions(question, index) {
                let optionsHtml = '';
                
                switch(question.type) {
                    case 'single':
                        // 单选题
                        question.options.forEach((option, optionIndex) => {
                            optionsHtml += `
                                <div class="option-item" data-option-index="${optionIndex}">
                                    <input type="radio" name="question-${question.id}" id="option-${question.id}-${optionIndex}" value="${optionIndex}">
                                    <label for="option-${question.id}-${optionIndex}" class="option-text">
                                        ${option.letter}. ${option.text}
                                    </label>
                                </div>
                            `;
                        });
                        break;
                        
                    case 'multiple':
                        // 多选题
                        question.options.forEach((option, optionIndex) => {
                            optionsHtml += `
                                <div class="option-item" data-option-index="${optionIndex}">
                                    <input type="checkbox" name="question-${question.id}" id="option-${question.id}-${optionIndex}" value="${optionIndex}">
                                    <label for="option-${question.id}-${optionIndex}" class="option-text">
                                        ${option.letter}. ${option.text}
                                    </label>
                                </div>
                            `;
                        });
                        break;
                        
                    case 'truefalse':
                        // 判断题
                        optionsHtml = `
                            <div class="truefalse-options">
                                <div class="truefalse-item" data-value="true">
                                    <input type="radio" name="question-${question.id}" id="true-${question.id}" value="true">
                                    <label for="true-${question.id}">正确</label>
                                </div>
                                <div class="truefalse-item" data-value="false">
                                    <input type="radio" name="question-${question.id}" id="false-${question.id}" value="false">
                                    <label for="false-${question.id}">错误</label>
                                </div>
                            </div>
                        `;
                        break;
                        
                    case 'short':
                        // 简答题
                        optionsHtml = `
                            <textarea class="short-answer-input" id="short-answer-${question.id}" 
                                      placeholder="请输入您的答案..." rows="3"></textarea>
                        `;
                        break;
                }
                
                return `<div class="options-container">${optionsHtml}</div>`;
            }
            
            // 绑定选项选择事件
            function bindOptionEvents() {
                // 单选题和判断题
                document.querySelectorAll('input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', function() {
                        const questionId = this.name.replace('question-', '');
                        const value = this.value;
                        
                        if (this.name.includes('truefalse')) {
                            // 判断题
                            document.querySelectorAll(`.truefalse-item[name="${this.name}"]`).forEach(item => {
                                item.classList.remove('selected');
                            });
                            this.closest('.truefalse-item').classList.add('selected');
                            userAnswers[questionId] = value === 'true';
                        } else {
                            // 单选题
                            document.querySelectorAll(`.option-item input[name="${this.name}"]`).forEach(input => {
                                input.closest('.option-item').classList.remove('selected');
                            });
                            this.closest('.option-item').classList.add('selected');
                            userAnswers[questionId] = [parseInt(value)];
                        }
                    });
                });
                
                // 多选题
                document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const questionId = this.name.replace('question-', '');
                        const optionIndex = parseInt(this.value);
                        
                        if (!userAnswers[questionId]) {
                            userAnswers[questionId] = [];
                        }
                        
                        if (this.checked) {
                            userAnswers[questionId].push(optionIndex);
                            this.closest('.option-item').classList.add('selected');
                        } else {
                            const index = userAnswers[questionId].indexOf(optionIndex);
                            if (index > -1) {
                                userAnswers[questionId].splice(index, 1);
                            }
                            this.closest('.option-item').classList.remove('selected');
                        }
                        
                        // 排序
                        userAnswers[questionId].sort((a, b) => a - b);
                    });
                });
                
                // 简答题
                document.querySelectorAll('.short-answer-input').forEach(textarea => {
                    textarea.addEventListener('input', function() {
                        const questionId = this.id.replace('short-answer-', '');
                        userAnswers[questionId] = this.value.trim();
                    });
                });
            }
            
            // 重置答案
            function resetAnswers() {
                if (confirm('确定要重置所有答案吗？')) {
                    userAnswers = {};
                    
                    // 重置UI
                    document.querySelectorAll('.option-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    
                    document.querySelectorAll('.truefalse-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                    
                    document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
                        input.checked = false;
                    });
                    
                    document.querySelectorAll('.short-answer-input').forEach(textarea => {
                        textarea.value = '';
                    });
                }
            }
            
            // 提交试卷
            function submitQuiz() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').style.display = 'none';
                }
                
                // 检查是否所有题目都已作答
                const unanswered = [];
                quizData.questions.forEach((question, index) => {
                    if (!userAnswers[question.id] || 
                        (Array.isArray(userAnswers[question.id]) && userAnswers[question.id].length === 0) ||
                        (typeof userAnswers[question.id] === 'string' && userAnswers[question.id] === '')) {
                        unanswered.push(index + 1);
                    }
                });
                
                if (unanswered.length > 0) {
                    if (!confirm(`您还有 ${unanswered.length} 道题未作答（第${unanswered.join(', ')}题），确定要提交吗？`)) {
                        if (timerInterval) {
                            startTimer();
                        }
                        return;
                    }
                }
                
                // 计算分数和生成报告
                const result = calculateScore();
                displayReport(result);
            }
            
            // 计算分数
            function calculateScore() {
                let totalScore = 0;
                let maxScore = 0;
                const results = [];
                
                quizData.questions.forEach(question => {
                    maxScore += question.score;
                    
                    const userAnswer = userAnswers[question.id];
                    const result = checkAnswer(question, userAnswer);
                    
                    results.push({
                        question: question,
                        userAnswer: userAnswer,
                        isCorrect: result.isCorrect,
                        score: result.score,
                        correctAnswer: result.correctAnswer
                    });
                    
                    totalScore += result.score;
                });
                
                return {
                    totalScore: totalScore,
                    maxScore: maxScore,
                    results: results,
                    percentage: (totalScore / maxScore * 100).toFixed(1),
                    passed: totalScore >= (quizData.answerConditions.passScore || 60)
                };
            }
            
            // 检查答案
            function checkAnswer(question, userAnswer) {
                let isCorrect = false;
                let score = 0;
                let correctAnswer = '';
                
                switch(question.type) {
                    case 'single':
                        // 单选题
                        correctAnswer = question.correctAnswers[0];
                        isCorrect = Array.isArray(userAnswer) && userAnswer.length === 1 && userAnswer[0] === correctAnswer;
                        score = isCorrect ? question.score : 0;
                        correctAnswer = question.options[correctAnswer].text;
                        break;
                        
                    case 'multiple':
                        // 多选题
                        correctAnswer = question.correctAnswers;
                        // 检查答案是否完全正确
                        if (Array.isArray(userAnswer) && userAnswer.length === correctAnswer.length) {
                            isCorrect = userAnswer.every((ans, index) => ans === correctAnswer[index]);
                        }
                        score = isCorrect ? question.score : 0;
                        correctAnswer = correctAnswer.map(idx => question.options[idx].text).join(', ');
                        break;
                        
                    case 'truefalse':
                        // 判断题
                        correctAnswer = question.correctAnswer;
                        isCorrect = userAnswer === correctAnswer;
                        score = isCorrect ? question.score : 0;
                        correctAnswer = correctAnswer ? '正确' : '错误';
                        break;
                        
                    case 'short':
                        // 简答题（支持多个正确答案）
                        correctAnswer = question.correctAnswers;
                        if (typeof userAnswer === 'string' && userAnswer.trim()) {
                            const userAnswerNormalized = userAnswer.trim().toLowerCase();
                            isCorrect = correctAnswer.some(correctAns => 
                                correctAns.trim().toLowerCase() === userAnswerNormalized
                            );
                        }
                        score = isCorrect ? question.score : 0;
                        correctAnswer = correctAnswer.join(' 或 ');
                        break;
                }
                
                return { isCorrect, score, correctAnswer };
            }
            
            // 显示报告
            function displayReport(result) {
                document.getElementById('quiz-container').style.display = 'none';
                document.getElementById('report-container').style.display = 'block';
                
                // 显示总分
                document.getElementById('total-score').textContent = result.totalScore;
                
                // 显示通过状态
                const passStatus = document.getElementById('pass-status');
                if (result.passed) {
                    passStatus.innerHTML = '<div class="pass-badge">通过 ✓</div>';
                } else {
                    passStatus.innerHTML = '<div class="fail-badge">未通过 ✗</div>';
                }
                
                // 统计正确和错误题目数量
                const correctCount = result.results.filter(r => r.isCorrect).length;
                const incorrectCount = result.results.length - correctCount;
                
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('incorrect-count').textContent = incorrectCount;
                
                // 显示每道题的详细结果
                const resultsList = document.getElementById('results-list');
                let resultsHtml = '';
                
                result.results.forEach((item, index) => {
                    const question = item.question;
                    const statusClass = item.isCorrect ? 'correct' : 'incorrect';
                    const statusText = item.isCorrect ? '正确' : '错误';
                    
                    let userAnswerText = '';
                    if (question.type === 'single' || question.type === 'multiple') {
                        if (Array.isArray(item.userAnswer)) {
                            userAnswerText = item.userAnswer.map(idx => question.options[idx].text).join(', ');
                        }
                    } else if (question.type === 'truefalse') {
                        userAnswerText = item.userAnswer ? '正确' : '错误';
                    } else if (question.type === 'short') {
                        userAnswerText = item.userAnswer || '未作答';
                    }
                    
                    resultsHtml += `
                        <div class="result-item ${statusClass}">
                            <div class="result-header">
                                <div class="question-title">第${index + 1}题: ${question.text}</div>
                                <div class="result-status ${statusClass}">${statusText} (${item.score}/${question.score}分)</div>
                            </div>
                            
                            <div class="user-answer">
                                <strong>您的答案:</strong> ${userAnswerText || '未作答'}
                            </div>
                            
                            <div class="correct-answer">
                                <strong>正确答案:</strong> ${item.correctAnswer}
                            </div>
                            
                            ${question.explanation ? `
                                <div class="explanation">
                                    <strong>答案解析:</strong> ${question.explanation}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                
                resultsList.innerHTML = resultsHtml;
                
                // 绑定报告页面按钮事件
                document.getElementById('restart-quiz').addEventListener('click', function() {
                    if (confirm('确定要重新答题吗？')) {
                        location.reload();
                    }
                });
                
                document.getElementById('print-report').addEventListener('click', function() {
                    window.print();
                });
            }
        });
    </script>
</body>
</html>
